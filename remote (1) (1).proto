syntax = "proto2";

package glassremote.remote;

option java_package = "com.glassremote.proto.remote";
option java_outer_classname = "RemoteProto";
option java_multiple_files = true;

// Android TV Remote protocol v2, command channel (TCP 6466, mutual TLS).

enum RemoteDirection {
  DIRECTION_UNKNOWN = 0;
  DIRECTION_START_LONG = 1;
  DIRECTION_END_LONG = 2;
  DIRECTION_SHORT = 3;
}

message RemoteDeviceInfo {
  optional string model = 1;
  optional string vendor = 2;
  optional int32 unknown1 = 3;
  optional string unknown2 = 4;
  optional string package_name = 5;
  optional string app_version = 6;
}

message RemoteConfigure {
  optional int32 code1 = 1;
  optional RemoteDeviceInfo device_info = 2;
}

message RemoteSetActive { optional int32 active = 1; }

message RemoteError {
  optional bool value = 1;
  optional RemoteMessage message = 2;
}

message RemotePingRequest {
  optional int32 val1 = 1;
  optional int32 val2 = 2;
}

message RemotePingResponse { optional int32 val1 = 1; }

message RemoteKeyInject {
  optional int32 key_code = 1;     // android.view.KeyEvent.KEYCODE_*
  optional RemoteDirection direction = 2;
}

message RemoteStart { optional bool started = 1; }

message RemoteSetVolumeLevel {
  optional uint32 unknown1 = 1;
  optional uint32 unknown2 = 2;
  optional string player_model = 3;
  optional uint32 unknown4 = 4;
  optional uint32 unknown5 = 5;
  optional uint32 volume_max = 6;
  optional uint32 volume_level = 7;
  optional bool volume_muted = 8;
}

message RemoteAppLinkLaunchRequest { optional string app_link = 1; }

message RemoteImeKeyInject {
  optional string app_info = 1;
  optional RemoteKeyInject key_inject = 2;
}

message RemoteImeBatchEdit {
  optional int32 counter = 1;
  optional string text = 2;
}

message RemoteTextFieldStatus {
  optional int32 counter = 1;
  optional string label = 2;
  optional int32 start = 3;
  optional int32 end = 4;
}

message RemoteMessage {
  optional RemoteConfigure remote_configure = 1;
  optional RemoteSetActive remote_set_active = 2;
  optional RemoteError remote_error = 3;
  optional RemotePingRequest remote_ping_request = 8;
  optional RemotePingResponse remote_ping_response = 9;
  optional RemoteKeyInject remote_key_inject = 10;
  optional RemoteImeBatchEdit remote_ime_batch_edit = 20;
  optional RemoteImeKeyInject remote_ime_key_inject = 21;
  optional RemoteTextFieldStatus remote_text_field_status = 30;
  optional RemoteStart remote_start = 40;
  optional RemoteSetVolumeLevel remote_set_volume_level = 50;
  optional RemoteAppLinkLaunchRequest remote_app_link_launch_request = 90;
}
