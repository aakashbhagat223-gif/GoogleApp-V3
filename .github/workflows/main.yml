name: HomeRemotePlus Production Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Decompress Source Code
      run: |
        if [ -f "HomeRemotePlus-v1.1.zip" ]; then
          echo "Unzipping HomeRemotePlus-v1.1.zip..."
          unzip -o HomeRemotePlus-v1.1.zip
        elif [ -f "project.zip" ]; then
          unzip -o project.zip
        fi

    - name: Normalize Project Tree
      run: |
        INNER_DIR=$(find . -maxdepth 3 -type f -name "settings.gradle.kts" -print -quit)
        if [ ! -z "$INNER_DIR" ] && [ "$INNER_DIR" != "./settings.gradle.kts" ]; then
          TARGET_DIR=$(dirname "$INNER_DIR")
          echo "Normalizing pathways from $TARGET_DIR..."
          cp -rn $TARGET_DIR/* . 2>/dev/null || true
          cp -rn $TARGET_DIR/.* . 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.9
        chmod +x gradlew

    - name: Build Standalone APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: HomeRemotePlus-v1.1-APK
        path: app/build/outputs/apk/debug/*.apk
